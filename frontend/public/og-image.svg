<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a1929"/>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a1929"/>
      <stop offset="50%" stop-color="#001e3c"/>
      <stop offset="100%" stop-color="#000d1a"/>
    </radialGradient>
    <radialGradient id="liquidGrad" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#1e88e5" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0d47a1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#002171" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="glassGrad" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#90caf9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d47a1" stop-opacity="0.05"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Decorative bubbles -->
  <circle cx="150" cy="100" r="8" fill="#42a5f5" opacity="0.2"/>
  <circle cx="1050" cy="150" r="12" fill="#90caf9" opacity="0.15"/>
  <circle cx="200" cy="500" r="6" fill="#64b5f6" opacity="0.25"/>
  <circle cx="1000" cy="480" r="10" fill="#42a5f5" opacity="0.18"/>
  <circle cx="100" cy="300" r="5" fill="#bbdefb" opacity="0.2"/>
  <circle cx="1100" cy="350" r="7" fill="#1e88e5" opacity="0.2"/>
  <circle cx="300" cy="550" r="4" fill="#90caf9" opacity="0.3"/>
  <circle cx="900" cy="80" r="9" fill="#64b5f6" opacity="0.15"/>

  <!-- Pod - centered -->
  <g transform="translate(600, 315) scale(1.3)">
    <!-- Pod stand/base -->
    <rect x="-40" y="130" width="80" height="12" rx="6" fill="#263238"/>
    <rect x="-30" y="122" width="60" height="12" rx="4" fill="#37474f"/>
    <rect x="-20" y="115" width="40" height="10" rx="3" fill="#455a64"/>

    <!-- Tubes -->
    <path d="M -20 115 Q -50 95 -60 55" fill="none" stroke="#546e7a" stroke-width="5" stroke-linecap="round"/>
    <path d="M 20 115 Q 50 95 60 55" fill="none" stroke="#546e7a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-60" cy="53" r="4" fill="#78909c"/>
    <circle cx="60" cy="53" r="4" fill="#78909c"/>

    <!-- Main pod glass -->
    <ellipse cx="0" cy="0" rx="90" ry="110" fill="url(#liquidGrad)" stroke="#455a64" stroke-width="5"/>
    <ellipse cx="0" cy="0" rx="86" ry="106" fill="url(#glassGrad)"/>
    <ellipse cx="0" cy="0" rx="90" ry="110" fill="none" stroke="#90caf9" stroke-width="1.5" opacity="0.4"/>

    <!-- Baby -->
    <g filter="url(#glow)" opacity="0.9">
      <ellipse cx="0" cy="10" rx="20" ry="25" fill="#ffcc80"/>
      <circle cx="0" cy="-18" r="16" fill="#ffe0b2"/>
      <path d="M -6 -20 Q -4 -18 -2 -20" fill="none" stroke="#5d4037" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 2 -20 Q 4 -18 6 -20" fill="none" stroke="#5d4037" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M -3 -13 Q 0 -11 3 -13" fill="none" stroke="#8d6e63" stroke-width="1" stroke-linecap="round"/>
      <path d="M -16 5 Q -22 -3 -18 -12" fill="none" stroke="#ffcc80" stroke-width="6" stroke-linecap="round"/>
      <path d="M 16 5 Q 22 -3 18 -12" fill="none" stroke="#ffcc80" stroke-width="6" stroke-linecap="round"/>
      <path d="M -10 30 Q -16 40 -12 47" fill="none" stroke="#ffcc80" stroke-width="6" stroke-linecap="round"/>
      <path d="M 10 30 Q 16 40 12 47" fill="none" stroke="#ffcc80" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="0" cy="32" rx="14" ry="9" fill="#e3f2fd" opacity="0.8"/>
    </g>

    <!-- Breathing tube -->
    <path d="M 0 -8 L 0 60 Q 0 80 -8 95 Q -15 108 -15 115" fill="none" stroke="#b0bec5" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="0" cy="-9" rx="6" ry="4" fill="#78909c" opacity="0.8"/>

    <!-- Bubbles -->
    <circle cx="-25" cy="70" r="4" fill="#42a5f5" opacity="0.6"/>
    <circle cx="20" cy="55" r="3" fill="#90caf9" opacity="0.5"/>
    <circle cx="-10" cy="80" r="5" fill="#64b5f6" opacity="0.4"/>
    <circle cx="30" cy="65" r="3" fill="#42a5f5" opacity="0.5"/>
    <circle cx="-20" cy="45" r="2.5" fill="#bbdefb" opacity="0.6"/>
    <circle cx="10" cy="85" r="4" fill="#1e88e5" opacity="0.3"/>

    <!-- Top cap -->
    <ellipse cx="0" cy="-108" rx="42" ry="7" fill="#37474f"/>
    <rect x="-42" y="-113" width="84" height="9" rx="4" fill="#455a64"/>
    <circle cx="0" cy="-117" r="4" fill="#4caf50"/>
  </g>

  <!-- Text - Title -->
  <text x="600" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" filter="url(#textGlow)" letter-spacing="3">YOU'RE INVITED!</text>
  <text x="600" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#90caf9" letter-spacing="2">Baby Shower • September 5, 2026</text>

  <!-- Top badge -->
  <rect x="450" y="20" width="300" height="36" rx="4" fill="none" stroke="#42a5f5" stroke-width="2" opacity="0.6"/>
  <text x="600" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#42a5f5" letter-spacing="4">🍼 BABY SHOWER</text>
</svg>
